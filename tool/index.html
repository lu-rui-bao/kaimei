<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小工具集合</title>
    <style>
        /* 添加加载遮罩层样式 */
        .loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2em;
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #f8c50d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 原有样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .tool-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .tool-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .tool-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tool-desc {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 添加加载遮罩层 -->
    <div class="loading-mask" id="loadingMask">
        <div class="loading-spinner"></div>
        <div>验证访问权限中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <img src="img\凯美商标 - 副本.gif" alt="Logo" style="float:left; margin:0 20px 20px 0; width:60px; height:auto;">

        <h1>🛠️ 小工具集合</h1>
        <p class="subtitle">简单易用的在线工具箱</p>

        <div class="tools-grid">
            <a href="parameter\index.html" class="tool-card">
                <div class="tool-icon">📊</div>
                <div class="tool-name">技术参数辅助</div>
                <div class="tool-desc">参数合并小助手V1.03</div>
            </a>

            <a href="score\index.html" class="tool-card">
                <div class="tool-icon">📝</div>
                <div class="tool-name">评分表编辑</div>
                <div class="tool-desc">评分规则制定工具</div>
            </a>

            <a href="product\index.html" class="tool-card">
                <div class="tool-icon">
                    <?xml version="1.0" encoding="UTF-8"?><svg width="52px" height="52px" stroke-width="1.5"
                        viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg " color="#f8c50d">
                        <path d="M7 12L17 12" stroke="#f8c50d" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                        <path d="M7 8L13 8" stroke="#f8c50d" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                        <path
                            d="M3 20.2895V5C3 3.89543 3.89543 3 5 3H19C20.1046 3 21 3.89543 21 5V15C21 16.1046 20.1046 17 19 17H7.96125C7.35368 17 6.77906 17.2762 6.39951 17.7506L4.06852 20.6643C3.71421 21.1072 3 20.8567 3 20.2895Z"
                            stroke="#f8c50d" stroke-width="1.5"></path>
                    </svg>
                </div>
                <div class="tool-name">产品信息查询</div>
                <div class="tool-desc">凯美产品信息查询</div>
            </a>

            <a href="login.html" class="tool-card">
                <div class="tool-icon">
                    <?xml version="1.0" encoding="UTF-8"?><svg width="52px" height="52px" viewBox="0 0 24 24"
                        stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg " color="#f8c50d">
                        <path
                            d="M8.5 4H6C4.89543 4 4 4.89543 4 6V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V6C20 4.89543 19.1046 4 18 4H15.5"
                            stroke="#f8c50d" stroke-width="1.5" stroke-linecap="round"></path>
                        <path
                            d="M8 6.4V4.5C8 4.22386 8.22386 4 8.5 4C8.77614 4 9.00422 3.77604 9.05152 3.50398C9.19968 2.65171 9.77399 1 12 1C14.226 1 14.8003 2.65171 14.9485 3.50398C14.9958 3.77604 15.2239 4 15.5 4C15.7761 4 16 4.22386 16 4.5V6.4C16 6.73137 15.7314 7 15.4 7H8.6C8.26863 7 8 6.73137 8 6.4Z"
                            stroke="#f8c50d" stroke-width="1.5" stroke-linecap="round"></path>
                    </svg>
                </div>
                <div class="tool-name">重新登录</div>
                <div class="tool-desc">切换用户或重新验证</div>
            </a>
        </div>

        <div class="footer">
            <p>
                © 2025 中山市凯美家具制造有限公司 | 让工作更简单
            </p>
        </div>
    </div>

    <script>
        // 立即执行的登录检查函数
        function checkAccess() {
            const accessGranted = sessionStorage.getItem('accessGranted');
            const accessTime = sessionStorage.getItem('accessTime');
            
            if (!accessGranted || !accessTime) {
                // 未登录，立即跳转
                window.location.replace('login.html');
                return false;
            }
            
            const currentTime = new Date().getTime();
            const timeDiff = currentTime - parseInt(accessTime);
            
            // 检查是否过期（24小时）
            if (timeDiff >= 24 * 60 * 60 * 1000) {
                // 已过期，清除数据并跳转
                sessionStorage.removeItem('accessGranted');
                sessionStorage.removeItem('accessTime');
                window.location.replace('login.html');
                return false;
            }
            
            // 验证通过，显示内容
            return true;
        }

        // 页面加载时立即检查
        if (!checkAccess()) {
            // 如果检查失败，阻止页面继续渲染
            document.documentElement.style.display = 'none';
        } else {
            // 验证通过，隐藏加载遮罩，显示主内容
            document.getElementById('loadingMask').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }
    </script>
</body>
</html>
